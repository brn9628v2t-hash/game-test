.choice.sp{border-color:var(--gold)}
.choice .tg{color:var(--gold)}

const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>v/16-.5);
function shade(sc,img,lights,opts){const {W,H,AR,Z,SHD}=sc,d=img.data;const amb=opts.amb||[.06,.065,.09];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,z=Z[i];let lr=amb[0],lg=amb[1],lb=amb[2];

 const status=()=>{$('fightHP').textContent=`당신 HP ${C.hp}/${C.maxhp} · 간수 HP ${enemy}/60`;};
 const log=t=>{const el=$('fightLog');el.innerHTML+=t+'<br>';el.scrollTop=el.scrollHeight;};const art=(l=0,r=0,block=false)=>fightArt(l,r,buff.blessed,block);status();art();if(buff.blessed){log('<b style="color:#f5d47e">신성한 기운이 당신의 몸을 감싼다.</b>');await pause(650);}
 for(let i=1;C.hp>10&&enemy>10;i++){await pause(400);art(1,0);await pause(150);if(i===criticalRound){enemy=10;log('<b style="color:#f5c96a">CRITICAL! 일격에 간수를 쓰러뜨렸다!</b>');status();art(0,3);break;}enemy=Math.max(10,enemy-attack);log('당신의 공격! 피해 '+attack);status();art(0,enemy<=10?3:0);if(enemy<=10)break;await pause(300);art(0,1);await pause(150);const hit=battleDamage(8,buff,true);if(hit.blocked){art(0,1,true);log('<b style="color:#f5d47e">DIVINE BLOCK! 신성한 보호막이 공격을 막았다.</b>');await pause(300);}else{const lost=hurt(Math.min(hit.damage,C.hp-10));log('간수의 반격! 체력 -'+lost);}status();art(C.hp<=10?3:0,0);}
 win=enemy<=10;
 log(win?'전투 승리':'전투 패배');await pause(1300);$('modal').classList.add('hidden');$('mBox').innerHTML='';
 if(win){recordEvent('guardWin','간수를 제압하고 감옥의 열쇠를 손에 넣었습니다.');S.flags.guardWon=true;storyCollect('meet');unlockCuffs();giveItem('가죽 갑옷');giveItem('간수의 짧은 검');giveItem('감옥 열쇠');return go('guardKeyRescue','당신은 간수의 아랫턱에 정확하게 주먹을 꽂아 넣습니다. 족쇄로는 당신을 막을 수 없었군요.<br><br>간수는 외마디 비명을 지르더니 앞으로 고꾸라져 버립니다.<br><br>당신은 발로 간수를 툭툭 쳐 보지만, 그는 미동조차 하지 않네요. 다행히 숨을 쉬고 있습니다.<br><br>그냥 완전히 기절한 거군요.<br><br>당신은 간수가 다시 정신을 차리기 전에 그의 장비와 열쇠를 챙겼습니다.'+'<div class="pick">족쇄 -1 · 획득: 가죽 갑옷, 간수의 짧은 검, 감옥 열쇠</div>'+'짐을 챙겨 서둘러 나가려는데, 옆 감방에서 메마른 목소리가 들려옵니다.<br><br>“이봐, 나도 꺼내 줘! 제발!”');}
 recordEvent('guardLoss','간수와 싸웠으나 패배했습니다.');S.flags.guardWon=false;return prisonerOffer('간수의 주먹이 당신의 옆구리를 강타합니다.<br><br>무겁고 지친 몸. 거기다 족쇄까지 찬 당신이 간수를 이길 수는 없었습니다. 당신은 더 이상 버티지 못하고 차가운 돌바닥에 쓰러졌습니다.<br><br>간수는 그런 당신을 내려다보며 침을 뱉습니다.<br><br>“별것도 아닌 게 까불고 있어.”<br><br>간수는 감방 밖으로 나가 문을 단단히 잠가 버리네요.<br><br>“얌전히 닥치고 있어.”<br><br>간수는 마지막으로 한 번 더 위협을 한 뒤, 그대로 떠납니다.<br><br>간수가 떠나고 당신은 욱신거리는 몸을 부여잡고 누워 있는데, 옆 감방에서 누군가의 목소리가 들려옵니다.<br><br>“이봐, 아직 살아 있어?”');
}
function prisonerOffer(prefix){S.flags.prisonerMet=true;storyCollect('meet');newScene('감옥 · 옆 감방');return go('prisonerOffer',prefix+'<br><br>'+'당신은 그의 정체를 물었지만, 그는 들은 척도 하지 않고 자신의 말을 이어 갑니다.<br><br>“여기서 나갈 길은 하나뿐이야. 바로 죽는 거지. 감방 안에서 죽든가 처형당해 죽든가.”<br><br>말이 제법 많군요. 그동안 이야기할 상대가 없었던 모양입니다.<br><br>“아니면 나를 돕든가! 마침 여길 탈출할 생각이거든. 너도 함께 꺼내 줄게. 물론 공짜는 아니지만.”');}
function prisonerDeal(){newScene("감옥 · 죄수의 도움");unlockCuffs();storyCollect("deal");storyCollect("debt");recordEvent("deal","애꾸눈 죄수의 도움으로 감방을 벗어났으며, 그에게 은혜를 입었습니다.");S.flags.prisoner="alive";S.flags.prisonerDebt=true;S.flags.escaped=true;return go("blast","그 죄수, 정말 탈출할 수 있는 방법을 알고 있는 걸까요?<br><br>한참이 지나도록 죄수의 목소리가 들리지 않네요. 당신은 벽에 귀를 바짝 대 보았지만, 숨소리조차 들리지 않습니다.<br><br>혼자 도망친 걸까요?<br><br>어쩌면 처음부터 환청이었을지도 모르죠.<br><br>포기한 당신은 벽에 기대앉아 어떻게 하면 여기서 나갈 수 있을지를 고민해 봅니다.<br><br>그때, 당신의 발밑으로 길쭉한 그림자가 드리웁니다. 고개를 들어 보니 쇠창살 너머로 낯선 사내가 보이네요.<br><br>앙상하게 마른 몸에 넝마를 걸친 애꾸눈의 사내.<br><br>“기다렸지?”<br><br>사내는 썩은 이를 드러내며 히죽 웃었습니다.<br><br>목소리를 들어 보니 옆 감방의 죄수군요.<br><br>그는 배낭에서 조잡하게 생긴 자물쇠 따개를 꺼냅니다. 자물쇠 안쪽을 몇 차례 건드리는가 싶더니 이내 감방 문이 열립니다.<br><br>철컥.<br><br>“자, 됐다.”<br><br>제법 능숙하군요. 한두 번 해 본 솜씨가 아닌데요.<br><br>사내는 당신의 손목에 채워진 족쇄까지 단숨에 풀고는 만족스러운 웃음을 짓습니다.<div class=\"pick\">족쇄 -1</div>당신은 약속한 보상을 줄 테니 함께 가자고 합니다. 하지만 사내는 고개를 저었습니다.<br><br>“돈? 그런 건 내게 아무런 가치도 없어. 대신 빚 하나를 달아 두지. 나중에 내가 널 찾아가면 그때 부탁 하나만 들어줘. 알겠지?”<br><br>사내는 의미심장한 미소를 지어 보이더니 조심스럽게 복도 너머로 사라졌습니다.");}
function prisonerReject(){storyCollect("ignore");recordEvent("reject","죄수의 탈출 제안을 거절했습니다.");S.flags.prisoner="alive";S.flags.prisonerRefused=true;return cellBlast("당신은 누군지도 모르는 죄수의 말을 무시하기로 합니다.<br><br>한참을 떠들어 대던 죄수도 당신이 아무런 반응이 없자 이내 조용해졌네요.<br><br>이제야 좀 조용해졌군요. 간수가 올 때까지 생각을 정리할 수 있겠습니다.<br><br>얼마나 지났을까요.<br><br>문득 인기척에 고개를 듭니다. 드디어 간수가 온 걸까요?<br><br>이런. 간수가 아니군요.<br><br>쇠창살 너머에는 앙상하게 마른 애꾸눈의 사내가 서 있습니다.<br><br>“기회가 있었는데, 안타깝군.”<br><br>사내는 썩은 이를 드러내며 웃더니 복도 너머로 유유히 사라졌습니다.",true);}
function cellBlast(prefix,keep=false,sleep=false){recordEvent('blast','감옥의 폭발에 휘말렸으나 살아남았습니다.');if(S.flags.prisoner!=='alive'){S.flags.prisoner='dead';storyCollect('death');}S.flags.escaped=true;if(!keep)newScene('감옥 · 폭발');unlockCuffs();const corpse=S.flags.prisoner==='dead'?'<br><br>폭발에 휘말린 것은 당신뿐만이 아니었네요. 옆 감방의 죄수로 보이는 남자가 무너진 돌무더기 사이에 쓰러져 있습니다.<br><br>당신은 시신을 뒤로하고 걸음을 옮겼습니다.':'';return go('blast',prefix+'<br><br>'+(sleep?'눈을 잠시 감았을 때,':'바로 그때.')+'<br><br><b>콰아앙!</b><br><br>귀를 찢는 듯한 폭음과 함께 감방 한쪽 벽이 터져 나갔습니다. 당신의 몸이 허공에 뜨는가 싶더니 이내 차가운 돌바닥에 처박혀 버렸습니다.<div class="hp-loss" data-blast="half">체력 -'+Math.floor(C.hp/2)+'</div>귓속에서 날카로운 이명이 울립니다. 온몸이 욱신거립니다. 갈비뼈가 부러졌을지도요. 아마도.<br>하지만 이곳에 계속 머물러 있을 수는 없습니다. 또다시 폭발이 일어날 수도 있으니까요. 당신은 가까스로 몸을 일으켰습니다.<br><br>먼지가 걷히자 밖으로 나가는 길이 보입니다.<br><br>다행히 폭발로 족쇄가 부서졌네요.<div class="pick">족쇄 -1</div>당신은 비틀거리며 한 걸음 내딛습니다.'+achievement('boom')+corpse);}
function guardRelease(){const title=C.gender==="f"?"아가씨":"도련님";return go("guardWait","간수는 벽에 걸린 횃불을 들고 당신의 얼굴을 찬찬히 살펴보더니, 곧 눈이 커집니다.<br><br>험상궂던 그의 표정이 놀란 표정으로, 그리고 환한 웃음으로 바뀝니다.<br><br>“세상에! TITLE이셨군요!”<br><br>그는 한 손으로 옷을 대충 추슬렀습니다. 그리곤 당신에게 고개를 숙입니다.<br><br>“지난번에 도와주신 일은 정말 감사했습니다! 아무래도 무슨 오해가 있었던 모양이죠? 잠시만 기다려 주십시오. 상관에게 보고하고 금방 꺼내 드리겠습니다.”<br><br>그는 허둥지둥 짤그랑대며 자리를 떠납니다.".replace("TITLE",title));}
function guardReturn(){recordEvent('guardHelp','안면이 있던 간수의 도움으로 감방을 벗어나 장비를 돌려받았습니다.');S.flags.prisonerMet=true;storyCollect('meet');unlockCuffs();giveItem('철제 장검');giveItem('귀족의 평상복');return go('rescue','얼마나 지났을까요. 기다림에 지친 당신은 벽에 기대어 잠시 쉬기로 합니다.<br><br>그때, 간수가 문을 부서질 듯 열며 헐레벌떡 들어옵니다. 그는 떨리는 손으로 감방 문을 열고 당신의 양쪽 손목에 채워진 쇠고랑을 풀어 줍니다.'+'<div class="pick">족쇄 -1</div>'+'“큰일 났습니다! 어서 피하십시오!”<br><br>간수는 당신의 짐을 건네며 다급하게 말합니다.<br><br>“갑자기 나타난 오크와 트롤들이 도시를 공격하고 있습니다. 어디서 구했는지 화약 무기까지…….”<br><br>간수는 누가 쫓아오기라도 하는지 연신 복도 끝을 살핍니다.<br><br>“여하튼 빨리 피하셔야 합니다!”<br><br>그는 그 말만 남기고는 혼자 달아나 버렸습니다.'+'<div class="pick">획득: 철제 장검, 귀족의 평상복</div>'+'짐을 챙겨 서둘러 나가려는데, 옆 감방에서 메마른 목소리가 들려옵니다.<br><br>“나도 꺼내 줘! 제발!”<br><br>당신은 간수가 달아난 쪽을 바라봅니다. 지금 나가야 하지 않을까요?<br><br>죄수는 쇠창살 너머로 앙상한 팔을 내밀며 애처롭게 소리칩니다.<br><br>“부탁이야! 날 여기에 두고 가지 마!”');}
function rescued(prefix=''){recordEvent('rescueOutcome',S.node==='guardKeyRescue'?'당신은 감옥에 갇힌 죄수를 구출했습니다.':'당신은 위험을 무릅쓰고 죄수를 구출했습니다.',S.node==='guardKeyRescue'?'rescue':'riskRescue');storyCollect('rescue');S.flags.prisonerMet=true;S.flags.prisoner='rescued';S.flags.prisonerOwes=true;S.flags.escaped=true;return go('blast',prefix+'<br><br>죄수는 얼마나 여기 갇혀 있던 걸까요? 감방 밖으로 걸어 나온 몰골이 처참하네요. 제대로 먹지 못해 앙상하게 마른 몸에 있으나 마나 한 넝마를 걸치고 있습니다. 한쪽 눈은 텅 비어 있네요. 어쩌다 잃은 걸까요?<br><br>“고마워! 이 은혜는 잊지 않을게!”<br><br>그는 썩은 이가 훤히 드러나도록 활짝 웃더니 이내 복도 너머로 달아나 버렸습니다.'+achievement('rescue'));}
function keyBlast(){recordEvent('rescueOutcome','당신은 죄수를 구하려 했지만 끝내 구하지 못했습니다.','failedRescue');storyCollect('death');S.flags.prisoner='dead';S.flags.escaped=true;return go('blast','“빨리! 서둘러!”<br><br>죄수가 소리칩니다.<br><br>당신이 열쇠를 찾아보기 위해 복도로 걸음을 옮기는 순간.<br><br><b>콰아앙!</b><span data-blast="shake"></span><br><br>거대한 폭발이 당신을 내동댕이쳐 버렸습니다. 가까스로 정신을 차리고 일어난 당신이 뒤돌아보았을 때, 죄수의 감방은 완전히 무너져 있었습니다. 더 이상 그곳에서는 아무 소리도 들리지 않네요.');}
function ignorePrisoner(){const hasKey=C.quest.includes('감옥 열쇠');const tried=S.done.force||S.done.hinge;recordEvent('rescueOutcome',hasKey?'당신은 구할 수 있었던 죄수를 버리고 떠났습니다.':tried?'당신은 죄수를 구하려 했으나 결국 포기했습니다.':'당신은 죄수의 애원을 뒤로하고 떠났습니다.',hasKey?'abandonWithKey':tried?'failedRescue':'noMeans');storyCollect('ignore');S.flags.prisoner='unknown';S.flags.escaped=true;return go('blast','“부탁이야! 그냥 가지 마, 제발!”<br><br>당신은 죄수의 애원을 뒤로하고 걸음을 옮겼습니다. 누굴 도울 여유는 없으니까요. 복도 끝에 닿았을 때, 뒤에서 거대한 폭발음이 들립니다.<span data-blast="shake"></span><br><br>저 정도 폭발이면 아마 살아남기 힘들 것 같군요.'+achievement('ignore'));}

case 'start':l=INITIAL;break;
case 'stone':l=[stoneChoice('재도전한다.'),{id:'stoneQuit',label:'포기한다.',run:()=>go('wall','인내심이 바닥난 당신은 포기하기로 합니다.')}];break;
case 'identify':l=[{id:'identify',label:'어디선가 본 것 같다. 조사해 보자.',stat:'wis',dc:23,ok:identifyStone,ng:()=>go('wall','금화는 이곳에서 통용되는 게 아니군요. 쪽지에도 온통 알 수 없는 글자들뿐입니다.<br><br>당신은 바지 주머니 깊숙이 그것들을 집어넣었습니다.')},{id:'keepRelics',label:'함부로 펼치지 말고, 일단 챙겨 두자.',run:()=>go('wall','당신은 금화와 쪽지를 바지 주머니에 집어넣었습니다. 지금은 이런 것에 신경 쓸 때가 아니니까요.')}];break;
case 'revived':l=[{id:'reviveRetry',label:'재도전한다.',run:()=>go('guardPending','쓰읍! 이번엔 안 돼요. 아시겠어요?')},{id:'reviveQuit',label:'포기한다.',run:()=>go('guardPending','옳지. 잘했어요. 이제 얌전히 기다리는 거예요.')}];break;

case 'rescue':l=[{id:'force',label:'무기로 경첩을 부숴 본다.',stat:'str',dc:16,pre:'당신은 무기를 꺼내 양손으로 단단히 움켜쥐었습니다. 그리고 감방 문의 낡은 경첩을 힘껏 내리쳤습니다.',ok:()=>rescued('요란한 쇳소리와 함께 경첩이 부서졌습니다. 감방 문이 열리자 죄수가 기다렸다는 듯 뛰쳐나오네요.'),ng:'무기가 경첩에 부딪히며 불꽃이 튀었지만, 꿈쩍도 하지 않네요. 제법 낡아 보여서 간단한 일이라고 생각했는데.<br><br>“너 정말 그렇게 열릴 거라고 생각한 거야?”<br><br>죄수가 어이가 없다는 투로 핀잔을 줍니다.'},{id:'hinge',label:'주변에 쓸 만한 것이 있는지 살펴본다.',stat:'wis',dc:13,pre:'당신은 주변을 살피다가 간수가 앉았던 긴 의자가 눈에 띄었습니다. 머릿속에 뭔가 번뜩이는군요. 정말 가능할까요?',ok:()=>rescued('당신은 긴 의자를 지렛대 삼아 감옥 문에 끼운 뒤, 있는 힘껏 끝을 눌렀습니다. 낡은 경첩은 버티지 못하고 고정핀이 빠져 버렸네요.'),ng:'아무리 힘을 주어도 꿈쩍도 하지 않는군요. 결국 애꿎은 의자만 부서져 버렸습니다.'},{id:'ignore',label:'미안하지만 지금은 나도 급해!',run:ignorePrisoner}];if(!C.equipment.slice(0,2).some(n=>n&&['one','two'].includes(itemInfo(n).type)))l=l.filter(c=>c.id!=='force');if(S.done.force||S.done.hinge)l.push({id:'keySearch',label:'조금만 기다려. 열쇠를 찾아올 테니.',run:keyBlast});break;

function newScene(title){$('log').querySelectorAll('.entry').forEach(e=>e.remove());$('sceneWrap').style.display='none';document.querySelector('.gamehead').textContent=title;window.scrollTo(0,0);}
function addEntry(html){const d=document.createElement('div');d.className='entry';d.innerHTML=html;$('log').insertBefore(d,$('choices'));}
let diceBusy=false;
let narration=null;
function cancelNarration(){if(narration){const n=narration;narration=null;clearTimeout(n.timer);clearInterval(n.watch);n.resolve();}}
function narrate(html,opening=false,choices=true,style=""){
 cancelNarration();
 const d=document.createElement('div');d.className='entry '+style;d.style.animation='none';d.style.display=opening?'none':'';$('log').insertBefore(d,$('choices'));
 const template=document.createElement('template');template.innerHTML=html.replace(/(?:<br\s*\/?>\s*){2,}/gi,'<div class="paragap"></div>');
 let paragraphStart=true;
 function indentNarrative(root){for(const node of root.childNodes){if(node.nodeType===3){if(paragraphStart&&node.textContent.trim()){node.textContent='\u3000'+node.textContent;paragraphStart=false;}}else if(node.nodeType===1){if(node.tagName==='BR'||node.tagName==='DIV'){paragraphStart=true;continue;}if(!node.hasAttribute('data-blast'))indentNarrative(node);}}}
 indentNarrative(template.content);html=template.innerHTML;
 const units=[];let gap=0;
 function build(src,dst){for(const node of src.childNodes){if(node.nodeType===3){for(const ch of Array.from(node.textContent)){units.push({dst,ch,gap});gap=0;}}else if(node.nodeType===1){const el=node.cloneNode(false);units.push({dst,el,gap:0});if(node.tagName==='BR')gap++;else if(node.classList.contains('paragap'))gap+=2;if(el.hasAttribute('data-blast')||el.hasAttribute('data-revive')){units.push({el,marker:true,gap});gap=0;}build(node,el);}}}
 build(template.content,d);
 return new Promise(resolve=>{const n={timer:null,watch:null,resolve,phase:opening?'image':'text',i:0,last:performance.now(),finish:null,step:null};narration=n;
 const notified=new Set();const notify=el=>{const id=el.dataset.achievement;if(id&&!notified.has(id)){notified.add(id);queueAchievement(id);}};
 let revived=false;const revive=()=>{if(!revived&&d.querySelector('[data-revive]')){revived=true;C.hp=C.maxhp;updateBar();effect('sGame','reviveFlash');}};let blasted=false;const blast=()=>{const marker=d.querySelector('[data-blast]');if(marker&&!blasted){blasted=true;effect('sGame','blastShake');if(marker.dataset.blast==='half')hurt(Math.floor(C.hp/2));}};
 n.finish=()=>{if(narration!==n)return;clearTimeout(n.timer);clearInterval(n.watch);d.style.display='';d.innerHTML=html;narration=null;try{blast();revive();d.querySelectorAll('[data-achievement]').forEach(notify);updateBar();scrollDown();}finally{const done=()=>{if(choices&&$('sGame').classList.contains('on'))renderChoices();resolve();};if(blasted||revived)setTimeout(done,revived?850:400);else done();}};
 n.step=()=>{if(narration!==n)return;try{n.last=performance.now();if(!$('modal').classList.contains('hidden')){n.timer=setTimeout(n.step,100);return;}n.phase='text';d.style.display='';let u;while(n.i<units.length){u=units[n.i++];if(u.marker){blast();revive();continue;}if(u.el){u.dst.appendChild(u.el);if(u.el.dataset.achievement)notify(u.el);continue;}const sp=document.createElement('span');sp.textContent=u.ch;sp.className='letterShow '+(textSpeed==='fast'?'letterFast':'');u.dst.appendChild(sp);const bottom=sp.getBoundingClientRect().bottom;if(bottom>window.innerHeight-40)window.scrollBy(0,bottom-window.innerHeight+40);break;}if(n.i>=units.length){n.timer=setTimeout(n.finish,textSpeed==='fast'?80:140);return;}const speed=textSpeed==='fast'?12:22;n.timer=setTimeout(n.step,speed+((units[n.i]?.gap||0)>1?(textSpeed==='fast'?50:100):0));}catch(err){console.error('Narration fallback',err);n.finish();}};
 n.watch=setInterval(()=>{if(narration===n&&$('modal').classList.contains('hidden')&&!document.hidden&&performance.now()-n.last>(n.phase==='image'?5000:2000))n.finish();},500);
 n.timer=setTimeout(n.step,opening?2900:0);
 });
}
$('sGame').addEventListener('click',e=>{const n=narration;if(!n||e.target.closest('button,#bar,#modal,#diceOverlay'))return;if(!$('modal').classList.contains('hidden'))return;e.preventDefault();e.stopPropagation();if(n.phase==='image'){clearTimeout(n.timer);S.wakeStart=performance.now()-2500;drawCell(performance.now()/1000);n.phase='text';n.step();}else n.finish();},true);

const diceImgs=diceArt.map(src=>{const im=new Image();im.src=src;return im;});
function drawDice(t,n,turns){const g=$('diceCanvas').getContext('2d');g.clearRect(0,0,600,510);const rem=Math.pow(1-t,1.65),bounce=t<.2?-100*(1-t/.2):-Math.abs(Math.sin((t-.2)*Math.PI*2))*45*(1-t),shift=-85*rem+Math.sin(t*4)*28*(1-t);const settled=t>=.94;const idx=settled?0:1+Math.min(4,Math.floor(t*5))*2;const im=diceImgs[idx];g.save();g.translate(300+shift,245+bounce);if(im.complete&&im.naturalWidth){g.imageSmoothingEnabled=false;const w=294,h=294;g.drawImage(im,-w/2,-h/2,w,h);}if(t===1){g.textAlign='center';g.textBaseline='middle';const digit=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001001001001','111101111101111','111101111001111'];const str=String(n),px=8,x0=9-(str.length*4-1)*px/2,y0=-12-2.5*px;for(let j=0;j<str.length;j++)for(let k=0;k<15;k++)if(digit[Number(str[j])][k]==='1'){const x=x0+(j*4+k%3)*px,y=y0+Math.floor(k/3)*px;g.fillStyle='#201009';g.fillRect(x+2,y+2,px,px);g.fillStyle='#e9c58b';g.fillRect(x,y,px,px);}}g.restore();}
function animateDice(k){return new Promise(resolve=>{const o=$('diceOverlay'),r=$('diceResult'),turns=5;o.style.opacity='1';o.style.display='flex';r.textContent='';drawDice(0,k.r,turns);let start=null;function frame(now){if(start===null)start=now;const t=Math.min(1,(now-start)/1000);drawDice(t,k.r,turns);if(t<1)requestAnimationFrame(frame);else{r.textContent=k.res;r.style.color=k.blessed?'#f5d47e':k.ok?'#b5dd96':'#ffa3a0';o.style.boxShadow=k.blessed?'inset 0 0 90px #c99b4266':'none';setTimeout(()=>{o.style.opacity='0';setTimeout(()=>{o.style.display='none';resolve();},150);},1000);}}requestAnimationFrame(frame);});}
async function choose(c){if(diceBusy||(!c.repeat&&S.done[c.id]))return;diceBusy=true;$('choices').innerHTML='';try{let h=`<div class="pick">▶ ${c.tag?`[${c.tag}] `:''}${c.label}</div>`;if(!c.repeat)S.done[c.id]=true;if(c.run){await narrate(h,false,false);h=await c.run();}else{await narrate(h+(c.pre||''),false,false);h='';const k=check(c.stat,c.dc,c.stat.toUpperCase()+' 판정');await animateDice(k);const out=k.ok?c.ok:c.ng;h+=k.line+(typeof out==='function'?out():out);if(c.id==='origin')S.flags.originSuccess=k.ok;}updateBar();if(S.node==='stone'&&c.id==='look'){await narrate(h,false,false);const k=check('str',15,'STR 판정');await animateDice(k);await finishAction(k.line+(k.ok?stoneSuccess():stoneFail()));}else if(S.node==='guardPending'){await narrate(h,false,false);await narrate(guard());}else if(S.node==='guardWait'){await narrate(h,false,false);await narrate(guardReturn());}else await finishAction(h);}finally{diceBusy=false;}}
async function finishAction(h){if(S.node==='revivePending'){await narrate(h,false,false);await narrate(reviveStone());}else await narrate(h);}
function renderChoices(){const box=$('choices');box.innerHTML='';
  choiceList().forEach((c,i)=>{const b=document.createElement('button');b.className='choice'+(c.tag?' sp':'');

function waitRecallClick(){return new Promise(resolve=>{const hint=document.createElement('button');hint.id='recallContinue';hint.textContent='화면을 터치하여 계속';$('log').appendChild(hint);const finish=()=>{document.removeEventListener('click',onClick,true);hint.remove();recallContinue=null;resolve();};const onClick=e=>{if(!e.target.closest('#sGame')||e.target.closest('#bar,#modal,#diceOverlay')||!$('modal').classList.contains('hidden'))return;e.preventDefault();e.stopPropagation();finish();};recallContinue=finish;document.addEventListener('click',onClick,true);scrollDown();});}
function memoryPicture(){return new Promise(resolve=>{const wrap=document.createElement('div');wrap.className='entry memoryImage';const c=document.createElement('canvas');c.width=256;c.height=192;wrap.appendChild(c);$('log').insertBefore(wrap,$('choices'));const src=document.createElement('canvas');src.width=256;src.height=192;drawTavern(performance.now()/1000,src.getContext('2d'));const g=c.getContext('2d');g.imageSmoothingEnabled=false;let start;scrollDown();function frame(now){if(!wrap.isConnected){resolve();return;}if(start===undefined)start=now;const q=Math.min(1,(now-start)/1500),amp=8*(1-q);c.style.opacity=String(q);g.clearRect(0,0,256,192);for(let y=0;y<192;y+=2){const dx=Math.round(Math.sin(y*.12-q*10)*amp);g.drawImage(src,0,y,256,2,dx,y,256,2);}if(q<1)requestAnimationFrame(frame);else resolve();}requestAnimationFrame(frame);});}

const ITEM_DB={'에케어 금화':{type:'quest',icon:'●',desc:'사라진 고대 국가 에케어의 금화'},'에케어 쪽지':{type:'quest',icon:'▤',desc:'에케어어로 쓰인 쪽지'},'족쇄':{type:'restraint',icon:'⛓',desc:'양 손목을 묶는 족쇄. 직접 해제할 수 없습니다.'},'오래된 금화':{type:'quest',icon:'●',desc:'처음 보는 금화'},'알 수 없는 쪽지':{type:'quest',icon:'▤',desc:'알 수 없는 글자가 적힌 쪽지'},'가죽 갑옷':{type:'armor',icon:'♜',desc:'가죽 방어구'},'간수의 짧은 검':{type:'one',icon:'⚒',desc:'한손 무기'},'감옥 열쇠':{type:'quest',icon:'⚿',desc:'감방을 여는 열쇠'},'철제 장검':{type:'one',icon:'⚔',desc:'한손 무기'},'귀족의 평상복':{type:'armor',icon:'♜',desc:'일반 의복'}};
function itemInfo(name){return ITEM_DB[name]||{type:'misc',icon:'◆',desc:'일반 물품'};}
function capacity(){return 7+Math.floor(C.st.str/3);}
function slotsFor(name){const t=itemInfo(name).type;return t==='one'||t==='shield'?[0,1]:t==='two'?[0]:t==='armor'?[2]:t==='accessory'?[3,4]:[];}
function autoSlot(name){return slotsFor(name).find(i=>!C.equipment[i]&&(itemInfo(name).type!=='two'||!C.equipment[1]));}
let pendingLoot=null,invTab='bag',invSel=null;
function equipAt(name,i){C.equipment[i]=name;if(itemInfo(name).type==='two')C.equipment[1]='@locked';}
function unlockCuffs(){for(let i=0;i<2;i++)if(C.equipment[i]==='족쇄')C.equipment[i]=null;}
function giveItem(name){if(itemInfo(name).type==='quest'||autoSlot(name)!==undefined||C.items.length<capacity())collect('item',name);if(itemInfo(name).type==='quest'){C.quest.push(name);return true;}const i=autoSlot(name);if(i!==undefined){equipAt(name,i);return true;}if(C.items.length<capacity()){C.items.push(name);return true;}pendingLoot=name;showInventory('bag');return false;}
function invAction(action,i){if(action==='discard'){C.items.splice(i,1);}if(action==='replaceLoot'&&pendingLoot){collect('item',pendingLoot);C.items[i]=pendingLoot;pendingLoot=null;}if(action==='skip'){pendingLoot=null;}if(action==='unequip'&&C.items.length<capacity()){const n=C.equipment[i];if(n&&n!=='@locked'&&n!=='족쇄'){C.items.push(n);C.equipment[i]=null;if(itemInfo(n).type==='two')C.equipment[1]=null;}}if(action==='equip'){const n=C.items[i];let k=autoSlot(n);if(k!==undefined){C.items.splice(i,1);equipAt(n,k);}else{const t=itemInfo(n).type;k=slotsFor(n).find(j=>!['@locked','족쇄'].includes(C.equipment[j]));if(k!==undefined){if(t==='two'&&C.equipment[1]==='족쇄')return;const old=C.equipment[k];if(t==='two'&&C.equipment[1]&&C.equipment[1]!=='@locked'){if(C.items.length>=capacity())return;C.items.push(C.equipment[1]);}if(old&&itemInfo(old).type==='two')C.equipment[1]=null;C.items.splice(i,1);if(old)C.items.push(old);equipAt(n,k);}}}invSel=null;showInventory(invTab);}
function selectInv(k,i){invSel={k,i};showInventory(invTab,true);}
function showInventory(tab='bag',keep=false){if(!C||diceBusy&&!narration&&!pendingLoot)return;invTab=tab;if(!keep)invSel=null;const cell=(n,k,i)=>`<button class="invcell" onclick="selectInv('${k}',${i})"><b>${n==='@locked'?'▣':n?itemInfo(n).icon:'·'}</b>${n==='@locked'?'사용 중':n||''}</button>`;let h='<div class="invhead"><h3>인벤토리</h3><button onclick="closeModal()">×</button></div><div class="invgrid">'+['오른손','왼손','방어구','장신구','장신구'].map((n,i)=>`<div><div class="invlab">${n}</div>${cell(C.equipment[i],'eq',i)}</div>`).join('')+'</div><div class="invtabs"><button class="'+(tab==='bag'?'active':'')+'" onclick="showInventory(&quot;bag&quot;)">배낭</button><button class="'+(tab==='quest'?'active':'')+'" onclick="showInventory(&quot;quest&quot;)">퀘스트</button></div>';if(pendingLoot)h+='<p>배낭이 가득 찼습니다. '+pendingLoot+' 획득을 위해 버릴 물품을 선택하세요.</p><button onclick="invAction(&quot;skip&quot;,0)">줍지 않는다.</button>';if(tab==='bag'){h+=`<div class="row"><span>배낭 ${C.items.length}/${capacity()}</span><span>금화 ${C.gold}</span></div><div class="invgrid">${Array.from({length:capacity()},(_,i)=>cell(C.items[i],'bag',i)).join('')}</div>`;}else{h+=C.quest.length?'<div class="invgrid">'+C.quest.map((n,i)=>cell(n,'quest',i)).join('')+'</div>':'<p>퀘스트 물품이 없습니다.</p>';h+='<small>사용 및 버리기 불가</small>';}if(invSel){const {k,i}=invSel,n=(k==='eq'?C.equipment:k==='bag'?C.items:C.quest)[i];if(n&&n!=='@locked'){h+=`<div class="invdetail">${n}<br><small>${itemInfo(n).desc}</small><br>`;if(k==='bag'){if(pendingLoot)h+=`<button onclick="invAction('replaceLoot',${i})">버리고 획득</button>`;else{if(slotsFor(n).length)h+=`<button onclick="invAction('equip',${i})">착용</button>`;h+=`<button onclick="invAction('discard',${i})">버리기</button>`;}}if(k==='eq'&&n!=='족쇄')h+=`<button ${C.items.length>=capacity()?'disabled':''} onclick="invAction('unequip',${i})">해제</button>`;h+='</div>';}}openModal(h);$('modal').classList.add('inventory');}

let collection={achievement:{},item:{},monster:{},person:{},story:{}};try{const old=JSON.parse(localStorage.getItem(META_KEY)||'null');if(old)for(const k of Object.keys(collection))if(old[k]&&typeof old[k]==='object')collection[k]=old[k];}catch(e){}
for(const [a,b] of [['간수의 쇠몽둥이','간수의 짧은 검'],['간수의 가죽 갑옷','가죽 갑옷']])if(collection.item[a])collection.item[b]=true;
function collect(kind,id){if(collection[kind][id])return false;collection[kind][id]=true;try{localStorage.setItem(META_KEY,JSON.stringify(collection));}catch(e){}return true;}
const ACH={stoneDeath1:['가장 멍청한 죽음 Ⅰ','감방의 돌을 빼내려다 사망한다.'],revive:['이번 한 번뿐입니다.','누군가의 개입으로 죽음에서 돌아온다.'],stoneDeath2:['가장 멍청한 죽음 Ⅱ','기적적으로 살아났음에도 같은 실수를 반복한다.'],rescue:['작은 자비','감옥에 갇힌 죄수를 구출했습니다.'],ignore:['어쩔 수가 없었다.','죄수의 애원을 뒤로하고 떠났습니다.'],boom:['BOOM!','감방 폭발에서 살아남았습니다.']};
function achievement(id){return collect('achievement',id)?'<span data-achievement="'+id+'" hidden></span>':'';}
const toastQueue=[];let toastActive=false;
function queueAchievement(id){toastQueue.push(id);showNextToast();}
function showNextToast(){if(toastActive||!toastQueue.length)return;toastActive=true;const id=toastQueue.shift(),el=document.createElement('div');el.className='achievementToast';el.setAttribute('role','status');const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');const p=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};p(0,0,32,32,'#382c20');if(id==='boom'){p(13,3,6,26,'#d07732');p(3,13,26,6,'#d07732');p(8,8,16,16,'#eab253');p(12,12,8,8,'#fff0a0');}else if(id==='rescue'){for(const [x,y] of [[3,15],[18,5]]){p(x,y,11,11,'#a69b89');p(x+2,y+2,7,7,'#382c20');}p(13,11,3,3,'#e4c182');p(17,17,3,3,'#e4c182');}else if(id==='revive'){p(5,10,9,9,'#d0a95b');p(18,10,9,9,'#d0a95b');p(9,15,14,9,'#d0a95b');p(13,24,6,4,'#d0a95b');p(15,4,2,6,'#fff0a0');}else if(id==='stoneDeath1'||id==='stoneDeath2'){p(7,5,18,16,'#c6b89e');p(11,21,10,5,'#c6b89e');p(10,11,4,5,'#382c20');p(18,11,4,5,'#382c20');p(15,17,2,3,'#382c20');if(id==='stoneDeath2')p(25,3,4,26,'#a95642');}else{p(7,3,18,26,'#9c8768');p(10,6,12,20,'#47372a');for(let x=11;x<24;x+=4)p(x,6,2,20,'#a99a80');p(8,16,16,3,'#a99a80');}el.appendChild(c);const label=document.createElement('div');label.innerHTML='<small>업적 달성!</small>'+ACH[id][0];el.appendChild(label);document.body.appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>{el.remove();toastActive=false;showNextToast();},350);},3000);}
const STORIES={meet:'옆 감방의 죄수',deal:'수상한 거래',debt:'은혜를 입은 자',rescue:'은혜를 베푼 자',death:'비극적인 최후',ignore:'외면당한 죄수'};
function storyCollect(id){collect('person','prisoner');collect('story','meet');collect('story',id);}
function showAchievements(){const ids=Object.keys(ACH);openModal('<h3>업적 '+ids.filter(k=>collection.achievement[k]).length+' / '+ids.length+'</h3>'+ids.map(k=>'<p style="border-bottom:1px solid #51432e;padding:12px;color:'+ (collection.achievement[k]?'var(--gold)':'var(--dim)')+'">'+(collection.achievement[k]?'◆ '+ACH[k][0]+'<br><small>'+ACH[k][1]+'</small>':'▣ ????? · 미달성')+'</p>').join('')+'<button onclick="closeModal()">닫기</button>');}
function showCodex(tab='item',selected=-1){const names=tab==='item'?Object.keys(ITEM_DB):tab==='monster'?['오크','트롤']:['prisoner','guard'];const labels={prisoner:'애꾸눈 죄수',guard:'감옥의 간수'};let h='<h3>도감</h3><div class="invtabs">'+[['item','아이템'],['monster','몬스터'],['person','인물']].map(([k,n])=>`<button class="${k===tab?'active':''}" onclick="showCodex('${k}')">${n}</button>`).join('')+'</div><p>수집 '+names.filter(n=>collection[tab][n]).length+' / '+names.length+'</p><div class="invgrid">'+names.map((n,i)=>`<button class="invcell" onclick="showCodex('${tab}',${i})"><b>${collection[tab][n]?(tab==='item'?itemInfo(n).icon:'◆'):'▣'}</b>${collection[tab][n]?(labels[n]||n):'???'}<small>${String(i+1).padStart(3,'0')}</small></button>`).join('')+'</div>';const n=names[selected];if(n){h+='<hr>';if(!collection[tab][n])h+='<p>아직 발견하지 못했습니다.</p>';else if(tab==='item')h+='<h3>'+n+'</h3><p>'+itemInfo(n).desc+'</p>';else if(tab==='person'){h+='<h3>'+labels[n]+'</h3>';if(n==='prisoner')h+='<p>본명: 불명 · 최초 조우: 감옥</p><p>앙상하게 마른 애꾸눈의 죄수입니다.</p><h4>발견한 이야기</h4>'+Object.keys(STORIES).map(k=>'<p>'+(collection.story[k]?'◆ '+STORIES[k]:'▣ ?????')+'</p>').join('');else h+='<p>감옥에서 근무하는 간수입니다.</p>';}else h+='<h3>'+n+'</h3>';}if(tab==='monster')h+='<p style="color:var(--dim)">실제로 조우하면 등록됩니다. 현재 몬스터 전투는 미작성 상태입니다.</p>';openModal(h+'<button onclick="closeModal()">닫기</button>');}

document.title='시라 제국 v'+VERSION;document.querySelectorAll('.verTxt').forEach(e=>e.textContent=VERSION);
$('sTitle').onclick=toChar;$('btnWake').onclick=toGame;$('hudPortrait').onclick=showStatus;$('hpBox').onclick=showStatus;$('stats').onclick=showStatus;$('btnSet').onclick=showSettings;
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();
  if($('sGame').classList.contains('on')&&$('modal').classList.contains('hidden')&&/^[1-9]$/.test(e.key)){const b=document.querySelectorAll('.choice')[+e.key-1];if(b)b.click();}});
let lastFrame=-100;function loop(ts){if(ts-lastFrame<50){requestAnimationFrame(loop);return;}lastFrame=ts;const t=ts/1000;if($('sTitle').classList.contains('on'))drawTitle(t);if($('sGame').classList.contains('on')&&S)(recall?drawTavern:drawCell)(t);requestAnimationFrame(loop);}
toTitle();requestAnimationFrame(loop);
