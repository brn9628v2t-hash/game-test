<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시라 제국 (v0.3.40)</title>
<link id="favicon" rel="icon">

<style>
:root{--gold:#c9a35a;--text:#e8dcc4;--dim:#9a8e78;--line:#3a3226;--panel:#14110e;--green:#8ad06a;--red:#e8584a;--fs:15px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:"Galmuri11","DungGeunMo","Malgun Gothic",sans-serif;font-size:var(--fs);line-height:1.7}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:#000}
.scr{display:none}.scr.on{display:block}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:var(--text);background:#1c1712;border:2px solid var(--line);cursor:pointer;padding:8px 12px}
button:hover:not(:disabled){border-color:var(--gold)}
button:disabled{opacity:.4;cursor:default}
.gold{background:var(--gold);color:#1a120a;border-color:#000}
/* 시작 화면 */
#sTitle{position:relative;height:100vh;height:100dvh;cursor:pointer;overflow:hidden}
#cvTitle{width:100%;height:100%;object-fit:cover}
#sTitle .q{position:absolute;left:0;right:0;top:75%;text-align:center;font-size:24px;letter-spacing:3px;opacity:0;color:#e8dcc4;text-shadow:0 0 8px #000}
#sTitle .tap{position:absolute;left:0;right:0;top:calc(75% + 46px);text-align:center;font-size:12px;letter-spacing:4px;color:#999;opacity:0}
#sTitle.go .q{animation:ap 3s ease .8s forwards}
#sTitle.go .tap{animation:bl 1.6s ease 3.8s infinite}
#sTitle .ver{position:absolute;right:10px;bottom:8px;font-size:11px;color:#444}
@keyframes ap{from{opacity:0}to{opacity:1}}
@keyframes bl{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes fd{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
/* 상태창 */
#sChar{padding:28px 14px;animation:fd .6s ease}
.win{border:2px solid var(--gold);background:var(--panel);padding:16px}
.win h3{margin:0 0 12px;text-align:center;color:var(--gold);font-weight:normal;letter-spacing:6px;font-size:17px}
.sub{text-align:center;font-size:12px;color:#777;letter-spacing:3px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:.93em}
.row span:first-child{color:var(--dim);flex-shrink:0}
.row span:last-child{text-align:right}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;margin-top:12px;font-size:.93em}
.sg div{display:flex;justify-content:space-between}
.sg b{color:var(--gold);font-weight:normal}.sg b.up{color:var(--green)}
.note{text-align:center;font-size:12px;color:var(--dim);margin-top:10px}
/* 게임 */
#top{position:sticky;top:0;z-index:2;background:#000}
#bar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel);border-bottom:2px solid var(--line)}
.hpw{width:84px;flex-shrink:0;cursor:pointer}
.hpw .t{font-size:11px;color:var(--gold);line-height:1.3}
.hpb{height:8px;background:#3a1a14;border:1px solid #000}.hpb i{display:block;height:100%;background:var(--green);transition:width .4s}
#stats{display:grid;grid-template-columns:repeat(4,auto);gap:0 8px;font-size:11px;color:#c8bca4;line-height:1.45;cursor:pointer}
#stats b{color:var(--gold);font-weight:normal}
#btnSet{margin-left:auto;background:none;border:none;padding:4px;color:#c8bca4;font-size:22px;line-height:1}
#sceneWrap{border-bottom:2px solid var(--line);background:#000}
#cvScene{width:min(100%,calc(40vh*4/3));aspect-ratio:4/3;margin:0 auto}
#log{padding:12px 14px 4px}
.entry{animation:fd .35s ease;margin-bottom:14px}
.entry.old{opacity:.5}
.pick{color:var(--gold);font-size:.9em;margin-bottom:4px}
.ck{font-size:.88em}.ck.ok{color:var(--green)}.ck.ng{color:var(--red)}.ck b{color:#fff;font-weight:normal}
.entry b{color:var(--gold);font-weight:normal}
.sep{text-align:center;color:var(--dim);font-size:.85em;letter-spacing:3px;margin:16px 0}
#choices{display:flex;flex-direction:column;gap:6px;padding:4px 14px 28px}
.choice{text-align:left;display:flex;gap:10px;align-items:baseline;background:#1c1712}
.choice .n{color:var(--gold);flex-shrink:0}
.choice.sp{border-color:var(--gold)}
.choice .tg{color:var(--gold)}
.choice .ct{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap;padding-left:6px}
/* 창 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}
#modal .win{width:100%;max-width:440px;max-height:85vh;overflow:auto}
#modal ul{margin:4px 0 12px;padding-left:20px;font-size:.9em}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg .on{border-color:var(--gold);color:var(--gold)}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hidden{display:none!important}

#sChar.on{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px 22px}.win{border:1px solid #77613e;border-radius:8px}#sChar .win{width:100%;max-width:350px;padding:18px}.charhead{display:flex;align-items:center;gap:14px;margin-bottom:14px}.charportrait{width:88px;height:88px;margin:0;flex-shrink:0}.charidentity{flex:1;min-width:0}.charname{text-align:left;margin:0;font-size:21px}#charMeta{font-size:12px;color:var(--dim);line-height:1.6}#sChar .sg{padding:10px 0;margin-top:8px;gap:3px 20px}#sChar .row{padding:5px 0}.sg b{color:var(--text)}.sg b.up,#stats b.up{color:var(--green)}#bar{display:grid;grid-template-columns:40px minmax(0,1fr) 34px;gap:4px 9px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));align-items:center}.hudportrait{grid-column:1;grid-row:1;width:40px;height:40px}.hpw{grid-column:2;grid-row:1;width:100%;max-width:180px}#btnSet{grid-column:3;grid-row:1;margin:0}#stats{grid-column:1/-1;grid-row:2;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:4px 10px;font-size:10px;line-height:1.7}#stats b{color:var(--text)}#cvScene{width:100%;max-height:none;aspect-ratio:4/3;object-fit:contain}.gamehead{text-align:left;padding:6px 14px;letter-spacing:1px}#log{padding:14px 14px 4px}#choices .choice{border-width:1px;border-radius:5px;align-items:center}.choice.sp{border-color:#8c7043}.choice .ct{font-size:10px}.gold{border-radius:5px}

html,body,#app{background:#100e0b}#top{background:#1b1712}#bar{grid-template-columns:62px minmax(0,1fr) 30px;gap:4px 10px;border-bottom:1px solid #332b20;background:#1b1712;padding-bottom:9px}.hudportrait{grid-row:1/3;width:62px;height:62px}.hpw{grid-column:2;grid-row:1;max-width:none}#stats{grid-column:2;grid-row:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 5px;font-size:11px;text-align:left}#btnSet{grid-column:3;grid-row:1/3;align-self:center;color:#ad9a78}.gamehead{background:transparent}#sceneWrap{position:relative;border:0;background:#100e0b}#sceneWrap:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,#100e0b,transparent 12%,transparent 88%,#100e0b),linear-gradient(to bottom,#100e0b,transparent 12%,transparent 74%,#100e0b)}#cvScene{height:auto;width:100%;aspect-ratio:4/3}#log{padding-top:8px}.choice>span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}.choice .ct{display:flex;align-items:center;gap:4px;flex-shrink:0;padding-left:0}.choice .ct svg{flex-shrink:0}.entry i{color:#bda98a}@media(max-width:350px){#bar{grid-template-columns:54px minmax(0,1fr) 27px;gap:4px 6px}.hudportrait{width:54px;height:54px}#stats{font-size:10px}}
</style>

function hash(x,y,s){let h=(x*374761393+y*668265263+s*982451653)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;}

const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>v/16-.5);

const dv=[[-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],[0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],[phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]];
const df=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
const du=a=>a.map(x=>x/Math.hypot(...a)),dd=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
const dz=du(df[0].reduce((s,j)=>s.map((x,k)=>x+dv[j][k]),[0,0,0]));
const dy=du(dv[0].map((x,i)=>x-dd(dv[0],dz)*dz[i]));
const dx=[dy[1]*dz[2]-dy[2]*dz[1],dy[2]*dz[0]-dy[0]*dz[2],dy[0]*dz[1]-dy[1]*dz[0]];
const db=dv.map(a=>[dd(a,dx),-dd(a,dy),dd(a,dz)]);
function drawDice(t,n,turns){const g=$('diceCanvas').getContext('2d');g.clearRect(0,0,600,510);const rem=Math.pow(1-t,1.65),a=turns*2*Math.PI*rem,b=1.4*Math.PI*rem,d=.8*Math.PI*rem;
const bounce=t<.2?-100*(1-t/.2):-Math.abs(Math.sin((t-.2)*Math.PI*5))*45*(1-t),shift=-85*rem+Math.sin(t*9)*28*(1-t);
g.save();g.translate(300+shift,400);g.scale(1,.22);const sh=g.createRadialGradient(0,0,5,0,0,140);sh.addColorStop(0,'rgba(0,0,0,.65)');sh.addColorStop(1,'transparent');g.fillStyle=sh;g.beginPath();g.arc(0,0,140,0,Math.PI*2);g.fill();g.restore();
const vv=db.map(([X,Y,Z])=>{let u=X*Math.cos(a)-Z*Math.sin(a);Z=X*Math.sin(a)+Z*Math.cos(a);X=u;u=Y*Math.cos(b)-Z*Math.sin(b);Z=Y*Math.sin(b)+Z*Math.cos(b);Y=u;u=X*Math.cos(d)-Y*Math.sin(d);Y=X*Math.sin(d)+Y*Math.cos(d);X=u;const q=850/(850-Z*45);return [300+shift+X*82*q,245+bounce+Y*82*q,Z];});
const faces=df.map((ids,i)=>({i,P:ids.map(j=>vv[j]),z:ids.reduce((s,j)=>s+vv[j][2],0)/3})).sort((a,b)=>a.z-b.z);
for(const face of faces){const P=face.P,L=Math.max(16,Math.min(65,35+face.z*17+(300-P[0][0])*.04));g.beginPath();P.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();const gr=g.createLinearGradient(P[0][0],P[0][1],P[2][0],P[2][1]);gr.addColorStop(0,`hsl(24,22%,${Math.min(83,L+20)}%)`);gr.addColorStop(.5,`hsl(20,16%,${L}%)`);gr.addColorStop(1,`hsl(12,29%,${Math.max(9,L-19)}%)`);g.fillStyle=gr;g.fill();g.strokeStyle='rgba(150,113,81,.45)';g.lineWidth=1.2;g.stroke();}
if(t===1){const P=df[0].map(j=>vv[j]);g.textAlign='center';g.textBaseline='middle';g.font='italic bold 65px Georgia';g.fillStyle='#d6b678';g.shadowColor='#170e08';g.shadowBlur=8;g.fillText(n,P.reduce((s,p)=>s+p[0],0)/3,P.reduce((s,p)=>s+p[1],0)/3-3);g.shadowBlur=0;}}
function animateDice(k){return new Promise(resolve=>{const o=$('diceOverlay'),r=$('diceResult'),turns=rnd(3,5);o.style.opacity='1';o.style.display='flex';r.textContent='';drawDice(0,k.r,turns);let start=null;function frame(now){if(start===null)start=now;const t=Math.min(1,(now-start)/1050);drawDice(t,k.r,turns);if(t<1)requestAnimationFrame(frame);else{r.textContent=k.res;r.style.color=k.ok?'#b5dd96':'#ffa3a0';setTimeout(()=>{o.style.opacity='0';setTimeout(()=>{o.style.display='none';resolve();},150);},1000);}}requestAnimationFrame(frame);});}
async function choose(c){if(diceBusy||S.done[c.id])return;diceBusy=true;$('choices').innerHTML='';try{let h=`<div class="pick">▶ ${c.tag?`[${c.tag}] `:''}${c.label}</div>`;
if(c.run)h+=c.run();else{const k=check(c.stat,c.dc,(c.stat==='luk'?'숨은 판정':c.stat.toUpperCase()+' 판정'));await animateDice(k);const out=k.ok?c.ok:c.ng;h+=k.line+(typeof out==='function'?out():out);}S.phase++;if(S.phase===1)h+='<br><br>그때 복도 너머에서 굉음이 울린다. 횃불이 흔들리고 간수들의 다급한 외침이 들린다.';if(S.phase===2&&!S.flags.open)h+='<br><br>잠시 뒤 피 묻은 간수가 비틀거리며 다가와 감방 문을 연다. “나가!” 그는 바닥에 쓰러진다.';if(S.phase===4)h+='<br><br>감옥을 벗어났다. 도시의 밤은 아직 끝나지 않았다.';addEntry(h);renderChoices();updateBar();scrollDown();}finally{diceBusy=false;}}
function renderChoices(){const box=$('choices');box.innerHTML='';
  choiceList().forEach((c,i)=>{const b=document.createElement('button');b.className='choice'+(c.tag?' sp':'');
    b.innerHTML=`<span class="n">${i+1}</span><span>${c.tag?`<span class="tg">[${c.tag}]</span> `:''}${c.label}</span>${c.stat&&c.stat!=='luk'?`<span class="ct">${c.stat.toUpperCase()} <svg viewBox="0 0 36 38" width="29" height="31" aria-label="목표 ${c.dc}"><path d="M18 2 L34 11 L34 27 L18 36 L2 27 L2 11 Z" fill="#272016" stroke="#bfa064"/><path d="M18 2 L8 26 L28 26 Z M2 11 L8 26 L18 36 L28 26 L34 11" fill="none" stroke="#88703e" stroke-width=".8"/><text x="18" y="23" text-anchor="middle" fill="#e8ce94" font-size="13" font-weight="bold">${c.dc}</text></svg></span>`:''}`;
    b.onclick=()=>choose(c);box.appendChild(b);});
  if(S.phase>=4){const b=document.createElement('button');b.className='choice';b.textContent='감옥 탈출 완료 · 새 모험 시작';b.onclick=toTitle;box.appendChild(b);}}
function endDemo(){addEntry('<div class="sep">— 여기까지가 v'+VERSION+' 체험판입니다 —</div>다음 업데이트에서 감옥 탈출이 이어집니다.');
  const box=$('choices');box.innerHTML='';const r=document.createElement('button');r.className='gold';r.textContent='새 캐릭터로 다시 시작';r.onclick=toTitle;box.appendChild(r);scrollDown();}

function portrait(id){const el=$(id),ch=C,img=new Image();el.width=el.height=256;el.style.imageRendering="auto";img.onload=()=>{if(C===ch)el.getContext("2d").drawImage(img,0,0,256,256)};img.src=PORTRAITS[C.blood+C.gender];}

/* ========== 화면 ========== */
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
function statHTML(){return STATS.map(([k,n])=>`<div><span>${n}</span><b class="${C.bonus[k]?'up':''}">${C.st[k]}</b></div>`).join('');}
function rowsHTML(compact=false){return [['성별',C.gender==='f'?'여성':'남성'],['혈통',BLOODS[C.blood]],['출신',ORIGINS[C.origin].name],['소지품',C.items.join(', ')||'없음'],['HP',`${C.hp} / ${C.maxhp}`]]
  .filter((r,i)=>!compact||i>=3).map(r=>`<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');}
function toChar(){C=makeChar();portrait('charPortrait');$('charName').textContent=C.name;$('charMeta').textContent=(C.gender==='f'?'여성':'남성')+' · '+BLOODS[C.blood]+' · '+ORIGINS[C.origin].name;$('charRows').innerHTML=rowsHTML(true);$('charStats').innerHTML=statHTML();show('sChar');}
function toGame(){S={phase:0,done:{},flags:{},wakeStart:performance.now(),shake:0};$('log').innerHTML='';addEntry(INTRO+'<br><br>'+MEMORIES[C.origin]+'<br><br><i>아, 그랬었지…….</i><br><br>몸을 일으키자 손목에 찬 쇠고랑이 철그럭거렸다.');portrait('hudPortrait');updateBar();renderChoices();show('sGame');}
function toTitle(){closeModal();show('sTitle');const t=$('sTitle');t.classList.remove('go');void t.offsetWidth;t.classList.add('go');}
function updateBar(){$('hpTxt').textContent=`HP ${C.hp}/${C.maxhp}`;$('hpFill').style.width=(C.hp/C.maxhp*100)+'%';
  $('stats').innerHTML=STATS.map(([k,,a])=>`<span>${k.toUpperCase()} <b class="${C.st[k]>3?'up':''}">${C.st[k]}</b></span>`).join('');}
function openModal(h){$('mBox').innerHTML=h;$('modal').classList.remove('hidden');}
function closeModal(){$('modal').classList.add('hidden');}
function showStatus(){openModal(`<h3>상태창</h3>${rowsHTML()}<div class="sg">${statHTML()}</div><button style="width:100%;margin-top:14px" onclick="closeModal()">닫기</button>`);}
function showUpdates(){openModal('<h3>업데이트 내역</h3>'+UPDATES.map(u=>`<div style="color:var(--gold)">v${u.v} <span style="color:var(--dim)">(${u.date})</span></div><ul>${u.items.map(i=>`<li>${i}</li>`).join('')}</ul>`).join('')+'<button style="width:100%" onclick="showSettings()">뒤로</button>');}
function showSettings(){const fs=getComputedStyle(document.documentElement).getPropertyValue('--fs').trim();
  const seg=[['13px','작게'],['15px','보통'],['18px','크게']].map(([v,n])=>`<button class="${fs===v?'on':''}" onclick="setFont('${v}')">${n}</button>`).join('');
  openModal(`<h3>설정</h3><div style="color:var(--dim);font-size:13px;margin-bottom:6px">글자 크기</div><div class="seg">${seg}</div>
  <div class="mbtns"><button onclick="toTitle()">처음부터 다시</button><button onclick="showUpdates()">업데이트 내역</button><button onclick="closeModal()">닫기</button></div><div class="note">시라 제국 v${VERSION}</div>`);}
function setFont(v){document.documentElement.style.setProperty('--fs',v);try{localStorage.setItem('shira_fs',v);}catch(e){}showSettings();}
try{const f=localStorage.getItem('shira_fs');if(f)document.documentElement.style.setProperty('--fs',f);}catch(e){}
